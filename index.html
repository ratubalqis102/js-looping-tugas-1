<!DOCTYPE html>
<html>
    <head>
        <title> JS LOOPING TUGAS 1</title>
        <style>
            body{
                margin: 0;
                height: 100vh;
                font-family: arial;
                align-items: center;
                justify-content: center;
                text-align: center;
                display: flex;
            }

            .card{
                width: 700px;
                padding: 10px;
                border-radius: 20px;
                background-color: plum;
                color: purple;
                text-align: center;
                box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>Tugas js array, looping dan function</h1>
        </div>

        <script>
            let angka=[];
            for (let i=1; i <= 100; i++){
                angka.push(i);
            }
            
            function printAngkaGanjil(angka){
                let ganjil=[];
                for (let i=0; i < angka.length; i++){
                    let result= angka[i];

                    if (result % 2 == 0){
                        ganjil.push(result);
                    }   
                }
                return ganjil;
            }
            console.log(printAngkaGanjil(angka));
        </script>
    </body>
</html>
